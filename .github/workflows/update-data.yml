name: 每日数据更新

on:
  schedule:
    # 北京时间每个交易日 18:00 (UTC 10:00)，周一至周五
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      code:
        description: '股票代码 (逗号分隔，默认更新宁德时代)'
        required: false
        default: '300750'
      force:
        description: '强制更新 (即使无新数据也重建JSON)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        continue-on-error: true
        run: |
          pip install --upgrade pip
          for i in 1 2 3; do
            pip install tushare pandas numpy && break
            echo "⚠️ pip install 失败，重试 ($i/3)..."
            sleep 5
          done

      - name: 检查 TUSHARE_TOKEN
        id: check_token
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo "⚠️ TUSHARE_TOKEN 未配置，跳过数据拉取"
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "请在 GitHub Settings → Secrets → Actions → Repository secrets 中添加 TUSHARE_TOKEN"
          else
            echo "✅ TUSHARE_TOKEN 已配置"
            echo "has_token=true" >> $GITHUB_OUTPUT
            echo "TUSHARE_TOKEN = '${TUSHARE_TOKEN}'" > local_config.py
          fi

      - name: 更新股票数据
        id: update
        if: steps.check_token.outputs.has_token == 'true'
        continue-on-error: true
        run: |
          CODE="${{ github.event.inputs.code || '300750' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"
          echo "更新股票: $CODE (force=$FORCE)"
          if [ "$FORCE" = "true" ]; then
            python update_data.py --code "$CODE" --no-convert --start 2019-01-01
          else
            python update_data.py --code "$CODE" --no-convert
          fi
          echo "data_updated=true" >> $GITHUB_OUTPUT

      - name: 重建 portfolio JSON
        continue-on-error: true
        run: |
          cd portfolio
          python convert_data.py
          echo "JSON 重建完成"

      - name: 检测变更
        id: diff
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📭 无数据变更"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📬 检测到数据更新"
          fi

      - name: 提交并推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          TODAY=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "📊 数据自动更新 — $TODAY"
          git push
          echo "✅ 已提交并推送到 GitHub"

      - name: 清理
        if: always()
        run: rm -f local_config.py

      - name: 汇总
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  数据更新流水线执行完毕"
          echo "  Token配置: ${{ steps.check_token.outputs.has_token || 'false' }}"
          echo "  数据更新: ${{ steps.update.outputs.data_updated || 'skipped' }}"
          echo "  数据变更: ${{ steps.diff.outputs.changed || 'false' }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
