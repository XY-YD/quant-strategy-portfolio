services:
  - type: web
    name: quant-strategy-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backtest_server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: TUSHARE_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
